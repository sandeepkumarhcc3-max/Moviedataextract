<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Data Extractor</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22223a;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f1f0ff;
      --muted: #8b8aa8;
      --border: #2e2e45;
      --radius: 12px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 16px;
    }

    /* ─── HEADER ─── */
    .header {
      text-align: center;
      padding: 20px 0 24px;
    }
    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent2);
    }
    .header h1 span { color: var(--text); }

    /* ─── INPUT SECTION ─── */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    input[type="url"] {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus { border-color: var(--accent); }
    input[type="url"]::placeholder { color: var(--muted); }

    .fetch-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--accent), #5b4fcf);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .fetch-btn:active { transform: scale(0.98); opacity: 0.9; }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ─── LOADING ─── */
    .loading {
      display: none;
      text-align: center;
      padding: 30px 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .loading.show { display: block; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── ERROR ─── */
    .error-box {
      display: none;
      padding: 14px 16px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius);
      color: var(--red);
      font-size: 0.88rem;
      margin-bottom: 16px;
    }
    .error-box.show { display: block; }

    /* ─── RESULT CARD ─── */
    .result-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .result-card.show { display: block; }

    /* Movie info top row */
    .movie-top {
      display: flex;
      gap: 14px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .movie-thumb {
      width: 90px;
      min-width: 90px;
      height: 130px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--surface2);
    }
    .movie-thumb-placeholder {
      width: 90px;
      min-width: 90px;
      height: 130px;
      border-radius: 8px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .movie-info { flex: 1; display: flex; flex-direction: column; gap: 7px; }

    .info-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .info-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .info-value {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .info-value.quality {
      color: var(--accent2);
      font-size: 1rem;
      font-weight: 800;
    }
    .info-value.name {
      font-size: 0.95rem;
      font-weight: 700;
    }

    /* ─── IMAGES SECTION ─── */
    .images-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .images-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .img-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .img-box img {
      width: 100%;
      border-radius: 8px;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: var(--surface2);
    }
    .img-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--surface2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* Screenshots grid preview */
    .screenshots-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      border-radius: 8px;
      overflow: hidden;
    }
    .screenshots-grid img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 0;
    }

    .dl-btn {
      width: 100%;
      padding: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent2);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dl-btn:active { background: var(--border); }

    /* ─── COPY SECTION ─── */
    .copy-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .copy-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .copy-btn {
      padding: 11px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-align: center;
    }
    .copy-btn:active { transform: scale(0.96); }
    .copy-btn.copied {
      background: rgba(34,197,94,0.15);
      border-color: rgba(34,197,94,0.4);
      color: var(--green);
    }

    /* ─── CREATE POST BUTTON ─── */
    .post-section { padding: 14px 16px; }
    .create-post-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .create-post-btn:active { transform: scale(0.98); }

    /* ─── POST PREVIEW ─── */
    .post-preview {
      display: none;
      margin-top: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .post-preview.show { display: block; }
    .post-text {
      font-size: 0.85rem;
      line-height: 1.7;
      white-space: pre-wrap;
      color: var(--text);
      word-break: break-word;
    }
    .copy-post-btn {
      margin-top: 12px;
      width: 100%;
      padding: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent2);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 10px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--green);
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎬 <span>Movie Data</span> Extractor</h1>
  </div>

  <!-- INPUT -->
  <div class="input-section">
    <label>Enter Movie / Series URL</label>
    <input type="url" id="urlInput" placeholder="https://hdhub4u.cl/movie-name/" />
    <button class="fetch-btn" id="fetchBtn" onclick="fetchData()">
      🚀 Fetch Data
    </button>
  </div>

  <!-- ERROR -->
  <div class="error-box" id="errorBox"></div>

  <!-- LOADING -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    Fetching movie data...
  </div>

  <!-- RESULT CARD -->
  <div class="result-card" id="resultCard">

    <!-- Movie Info -->
    <div class="movie-top">
      <div id="thumbContainer" class="movie-thumb-placeholder">🎬</div>
      <div class="movie-info" id="movieInfo"></div>
    </div>

    <!-- Images -->
    <div class="images-section" id="imagesSection" style="display:none">
      <div class="section-title">🖼 Images</div>
      <div class="images-row">
        <div class="img-box" id="thumbBox">
          <div class="img-placeholder">No Thumbnail</div>
        </div>
        <div class="img-box" id="screenshotBox">
          <div class="img-placeholder">No Screenshots</div>
        </div>
      </div>
    </div>

    <!-- Copy Options -->
    <div class="copy-section">
      <div class="section-title">📋 Copy Options</div>
      <div class="copy-grid" id="copyGrid"></div>
    </div>

    <!-- Create Post -->
    <div class="post-section">
      <button class="create-post-btn" onclick="createPost()">
        📤 Create Telegram Post
      </button>
      <div class="post-preview" id="postPreview">
        <div class="post-text" id="postText"></div>
        <button class="copy-post-btn" onclick="copyPost()">📋 Copy Post</button>
      </div>
    </div>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

<script>
  // ── CONFIG ────────────────────────────────────────────────────────
  // Replace with your Render backend URL after deployment
  const BACKEND_URL = "https://movieextractbot-backend.onrender.com";

  let currentData = null;

  // ── FETCH DATA ────────────────────────────────────────────────────
  async function fetchData() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) { showError("Please enter a URL."); return; }
    if (!url.startsWith('http')) { showError("Enter a valid URL starting with https://"); return; }

    hideError();
    showLoading(true);
    setFetchBtn(false);
    hideResult();

    try {
      const resp = await fetch(`${BACKEND_URL}/scrape`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      const data = await resp.json();

      if (!resp.ok || data.error) {
        showError(data.error || "Could not extract data. Try another URL.");
        return;
      }

      currentData = data;
      renderResult(data);

    } catch (err) {
      showError("Connection failed. Make sure backend is running.");
      console.error(err);
    } finally {
      showLoading(false);
      setFetchBtn(true);
    }
  }

  // ── RENDER RESULT ─────────────────────────────────────────────────
  function renderResult(data) {
    // Thumbnail
    const thumbContainer = document.getElementById('thumbContainer');
    if (data.thumbnail) {
      thumbContainer.innerHTML = `<img class="movie-thumb" src="${data.thumbnail}" alt="Thumbnail" onerror="this.parentElement.innerHTML='🎬'">`;
    }

    // Movie Info
    const fields = [
      { label: 'Name', value: data.name, cls: 'name' },
      { label: 'IMDb', value: data.imdb },
      { label: 'Genre', value: data.genre },
      { label: 'Language', value: data.language },
      { label: 'Quality', value: data.quality, cls: 'quality' },
    ];
    if (data.stars && data.stars !== 'N/A') fields.push({ label: 'Stars', value: data.stars });
    if (data.episodes) fields.push({ label: 'Episodes', value: data.episodes });

    document.getElementById('movieInfo').innerHTML = fields.map(f => `
      <div class="info-row">
        <span class="info-label">${f.label}</span>
        <span class="info-value ${f.cls || ''}">${f.value || 'N/A'}</span>
      </div>
    `).join('');

    // Images section
    const imagesSection = document.getElementById('imagesSection');
    const thumbBox = document.getElementById('thumbBox');
    const screenshotBox = document.getElementById('screenshotBox');

    if (data.thumbnail || (data.screenshots && data.screenshots.length)) {
      imagesSection.style.display = 'block';

      if (data.thumbnail) {
        thumbBox.innerHTML = `
          <img src="${data.thumbnail}" alt="Thumbnail" onerror="this.src=''">
          <button class="dl-btn" onclick="downloadImage('${data.thumbnail}', 'thumbnail.jpg')">⬇ Download</button>
        `;
      }

      if (data.screenshots && data.screenshots.length) {
        const previewScreens = data.screenshots.slice(0, 4);
        const gridHTML = previewScreens.map(s =>
          `<img src="${s}" alt="" onerror="this.style.display='none'">`
        ).join('');
        screenshotBox.innerHTML = `
          <div class="screenshots-grid">${gridHTML}</div>
          <button class="dl-btn" onclick="downloadMerged()">⬇ Download Merged</button>
        `;
      }
    }

    // Copy buttons
    const copyFields = [
      { label: '📋 Copy Name', key: 'name' },
      { label: '⭐ Copy IMDb', key: 'imdb' },
      { label: '🎭 Copy Genre', key: 'genre' },
      { label: '🌍 Copy Language', key: 'language' },
      { label: '📺 Copy Quality', key: 'quality' },
    ];

    document.getElementById('copyGrid').innerHTML = copyFields.map(f => `
      <button class="copy-btn" id="btn_${f.key}" onclick="copyField('${f.key}', this)">
        ${f.label}
      </button>
    `).join('');

    document.getElementById('resultCard').classList.add('show');
  }

  // ── COPY FIELD ────────────────────────────────────────────────────
  async function copyField(key, btn) {
    if (!currentData) return;
    const value = currentData[key] || '';
    try {
      await navigator.clipboard.writeText(value);
      btn.classList.add('copied');
      btn.textContent = '✅ Copied!';
      showToast(`${key.charAt(0).toUpperCase() + key.slice(1)} copied!`);
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = btn.getAttribute('data-original') || btn.textContent;
      }, 2000);
    } catch {
      // Fallback for older browsers
      const el = document.createElement('textarea');
      el.value = value;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast('Copied!');
    }
  }

  // ── DOWNLOAD IMAGE ────────────────────────────────────────────────
  async function downloadImage(url, filename) {
    try {
      const resp = await fetch(`${BACKEND_URL}/download-image`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, filename })
      });
      const blob = await resp.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
    } catch {
      // Fallback: open in new tab
      window.open(url, '_blank');
    }
  }

  async function downloadMerged() {
    if (!currentData || !currentData.screenshots?.length) return;
    showToast('Preparing merged image...');
    try {
      const resp = await fetch(`${BACKEND_URL}/merge-screenshots`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ screenshots: currentData.screenshots })
      });
      const blob = await resp.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'screenshots_merged.jpg';
      a.click();
    } catch (e) {
      showToast('Download failed. Try again.');
    }
  }

  // ── CREATE POST ───────────────────────────────────────────────────
  function createPost() {
    if (!currentData) return;
    const d = currentData;

    let post = `🎬 ${d.name || 'N/A'}\n\n`;
    post += `⭐ IMDb: ${d.imdb || 'N/A'}\n`;
    post += `🎭 Genre: ${d.genre || 'N/A'}\n`;
    post += `🌍 Language: ${d.language || 'N/A'}\n`;
    post += `📺 Quality: ${d.quality || 'N/A'}\n`;
    if (d.stars && d.stars !== 'N/A') post += `👥 Stars: ${d.stars}\n`;
    if (d.episodes) post += `📁 Episodes: ${d.episodes}\n`;
    post += '\n';
    if (d.storyline) {
      const short = d.storyline.length > 300 ? d.storyline.slice(0, 300) + '...' : d.storyline;
      post += `📖 Plot:\n${short}\n\n`;
    }
    post += `📥 Download Now: [Your Link Here]\n`;
    post += `📢 Join Channel: @yourchannel\n\n`;

    const tag = (d.name || '').replace(/[^a-zA-Z0-9]/g, '').slice(0, 15);
    post += `#${tag} #Hollywood #Hindi`;

    document.getElementById('postText').textContent = post;
    document.getElementById('postPreview').classList.add('show');
  }

  async function copyPost() {
    const text = document.getElementById('postText').textContent;
    try {
      await navigator.clipboard.writeText(text);
      showToast('Post copied!');
    } catch {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast('Post copied!');
    }
  }

  // ── HELPERS ───────────────────────────────────────────────────────
  function showLoading(show) {
    document.getElementById('loading').classList.toggle('show', show);
  }

  function setFetchBtn(enabled) {
    const btn = document.getElementById('fetchBtn');
    btn.disabled = !enabled;
    btn.textContent = enabled ? '🚀 Fetch Data' : '⏳ Fetching...';
  }

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = '❌ ' + msg;
    box.classList.add('show');
  }

  function hideError() {
    document.getElementById('errorBox').classList.remove('show');
  }

  function hideResult() {
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('postPreview').classList.remove('show');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = '✅ ' + msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Allow Enter key to fetch
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchData();
  });

  // Telegram WebApp init
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
</script>
</body>
</html>
